<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Aditya Kamat">
    <title>Vercel Skip Checks</title>
    <style>
      /* Main container styles */
      body {
        min-width: 200px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        margin: 0;
      }

      /* Button styles */
      button {
        width: 100%;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 6px;
        border: none;
        background: #0070f3;
        color: white;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: #0060df;
      }

      button:active {
        background: #0051cc;
      }

      button:disabled {
        background: #cccccc;
        cursor: not-allowed;
      }

      /* Status message styles */
      #status {
        margin-top: 12px;
        font-size: 13px;
        text-align: center;
        color: #666;
        min-height: 20px;
      }

      #status.success {
        color: #0070f3;
      }

      #status.error {
        color: #e00;
      }

      /* Author tagline styles */
      #tagline {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #eee;
        font-size: 11px;
        text-align: center;
        color: #999;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <!-- Main action button -->
    <button id="skipBtn" title="Skip all deployment checks on the current Vercel page">
      Skip All Checks
    </button>

    <!-- Status message display -->
    <div id="status"></div>

    <!-- Author tagline -->
    <div id="tagline">From frustration to fast-track ❤️ by Aditya Kamat</div>

    <!-- Load the popup logic -->
    <script src="popup.js"></script>
  </body>
</html>
